services:
  ffmusic:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: findingfocusdev/ffmusic:latest
    container_name: ffmusic
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5